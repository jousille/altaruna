name: Deploy to Timeweb

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operation
        type: choice
        options:
          - check
          - deploy
        default: check

permissions:
  contents: read

concurrency:
  group: timeweb-manual
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check FTP (read only, unencrypted)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?Missing FTP_SERVER}"
          : "${FTP_USERNAME:?Missing FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing FTP_PASSWORD}"
          echo "Checking IPv4 TCP connectivity to FTP port 21"
          if timeout 25 bash -c 'exec 3<>/dev/tcp/92.53.96.192/21'; then
            echo "TCP port 21 reachable"
          else
            echo "::warning::TCP connection to FTP IPv4 endpoint failed"
          fi
          curl -4 --fail --silent --show-error --connect-timeout 30 --max-time 90 --write-out '\nDNS: %{time_namelookup}s; TCP: %{time_connect}s; first byte: %{time_starttransfer}s; FTP response: %{response_code}\n' --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER:21/"
      - name: Deployment safety gate
        if: inputs.mode == 'deploy'
        run: |
          echo "::error::Deployment is not enabled until FTP access and the destination directory have been verified."
          exit 1
